services:
  mysql:
    image: mysql:8.0
    container_name: psychology-mysql
    restart: always
    ports:
      - "3909:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: psychology_booking
      MYSQL_USER: psychology
      MYSQL_PASSWORD: psychology123
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psychology-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/psychology_booking?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: psychology
      SPRING_DATASOURCE_PASSWORD: psychology123
      TZ: Asia/Shanghai
      JAVA_OPTS: -Dfile.encoding=UTF-8
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psychology-frontend
    restart: always
    ports:
      - "8081:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: psychology-frontend-admin
    restart: always
    ports:
      - "8082:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend

volumes:
  mysql_data:
